server:
  port: 8080

spring:
  application:
    name: ordering-system
  datasource:
    url: jdbc:h2:mem:ordering_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        open-in-view: false

# Konfigurasi Boundary Layer (Payment Gateway Pihak ke-3)
payment:
  gateway:
    endpoint-url: "https://api.mockpayment.com/v1/charge"
    api-key: "sk_live_sample_secret_key_12345"
